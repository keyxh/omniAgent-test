<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>OmniAgent - 员工管理</title>
    <script src="./assets/tailwind-cdn.js"></script>
    <link href="./assets/material-symbols-outlined.css" rel="stylesheet"/>
    <link href="./assets/inter-google.css" rel="stylesheet"/>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-error": "#ffffff",
                        "inverse-on-surface": "#eff1f3",
                        "background": "#f7f9fb",
                        "primary-fixed-dim": "#bec6e0",
                        "primary-fixed": "#dae2fd",
                        "on-surface-variant": "#45464d",
                        "on-secondary-fixed-variant": "#005049",
                        "surface-variant": "#e0e3e5",
                        "inverse-surface": "#2d3133",
                        "primary-container": "#131b2e",
                        "on-primary-fixed-variant": "#3f465c",
                        "secondary-fixed-dim": "#6bd8cb",
                        "on-secondary-container": "#006f66",
                        "secondary": "#006a61",
                        "surface-bright": "#f7f9fb",
                        "outline-variant": "#c6c6cd",
                        "on-primary": "#ffffff",
                        "inverse-primary": "#bec6e0",
                        "on-secondary": "#ffffff",
                        "secondary-container": "#86f2e4",
                        "on-secondary-fixed": "#00201d",
                        "on-tertiary-fixed-variant": "#004c69",
                        "on-surface": "#191c1e",
                        "surface-dim": "#d8dadc",
                        "surface-container": "#eceef0",
                        "tertiary-fixed": "#c4e7ff",
                        "on-tertiary-fixed": "#001e2c",
                        "on-tertiary-container": "#008ebf",
                        "surface-container-lowest": "#ffffff",
                        "tertiary-container": "#001e2c",
                        "tertiary": "#000000",
                        "on-primary-container": "#7c839b",
                        "surface-container-high": "#e6e8ea",
                        "on-tertiary": "#ffffff",
                        "tertiary-fixed-dim": "#7bd0ff",
                        "outline": "#76777d",
                        "on-primary-fixed": "#131b2e",
                        "surface-tint": "#565e74",
                        "inverse-surface": "#2d3133",
                        "error": "#ba1a1a",
                        "secondary-fixed": "#89f5e7",
                        "error-container": "#ffdad6",
                        "surface": "#f7f9fb",
                        "on-error-container": "#93000a",
                        "surface-container-highest": "#e0e3e5",
                        "primary": "#000000",
                        "on-background": "#191c1e",
                        "surface-container-low": "#f2f4f6"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-xs": "4px",
                        "stack-lg": "24px",
                        "sidebar-width": "260px",
                        "margin-page": "32px",
                        "gutter": "24px",
                        "container-max-width": "1200px",
                        "stack-sm": "8px",
                        "stack-md": "16px"
                    },
                    "fontFamily": {
                        "label-md": ["Inter"],
                        "display-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "label-sm": ["Inter"]
                    },
                    "fontSize": {
                        "label-md": ["14px", {"lineHeight": "20px", "fontWeight": "500"}],
                        "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                        "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                        "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                        "headline-lg-mobile": ["28px", {"lineHeight": "36px", "fontWeight": "600"}],
                        "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}]
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: theme('colors.background');
            color: theme('colors.on-background');
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            display: flex; align-items: center; justify-content: center;
            z-index: 9999;
        }
        .modal-overlay.hidden { display: none; }
        .hidden { display: none !important; }
    </style>
</head>
<body class="antialiased min-h-screen flex overflow-hidden">
<div class="flex-1 flex flex-col h-screen overflow-hidden">
    <header class="h-16 flex justify-between items-center px-margin-page w-full bg-surface/80 backdrop-blur-md border-b border-outline-variant/30 z-10 sticky top-0 shrink-0">
        <div class="flex items-center gap-4">
            <button class="md:hidden text-on-surface-variant hover:bg-surface-container-low p-2 rounded-full transition-colors active:scale-95">
                <span class="material-symbols-outlined">menu</span>
            </button>
            <a class="flex items-center text-on-surface-variant hover:text-on-surface text-label-md font-label-md transition-colors gap-1" href="./index.html">
                <span class="material-symbols-outlined text-[18px]">arrow_back</span>
                返回
            </a>
        </div>
        <div class="flex items-center gap-4">
            <button onclick="loadWorkers()" class="text-on-surface-variant hover:bg-surface-container-low p-2 rounded-full transition-colors">
                <span class="material-symbols-outlined">refresh</span>
            </button>
            <button onclick="openAddWorkerModal()" class="bg-primary hover:bg-primary/90 text-on-primary font-label-md text-label-md px-6 py-2.5 rounded-full shadow-sm transition-all flex items-center gap-2">
                <span class="material-symbols-outlined text-[18px]">add</span>
                添加员工
            </button>
        </div>
    </header>

    <main class="flex-1 overflow-y-auto bg-surface-container-lowest p-margin-page">
        <div class="max-w-container-max-width mx-auto">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-stack-lg">
                <div class="flex items-center gap-3">
                    <span class="material-symbols-outlined text-primary text-[32px]">group</span>
                    <h2 class="text-headline-lg font-headline-lg text-primary">员工管理</h2>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-4 gap-gutter mb-stack-lg">
                <div class="bg-surface-container-lowest border border-outline-variant/20 rounded-xl p-4 shadow-[0_4px_12px_rgba(0,0,0,0.02)] flex items-center gap-4">
                    <div class="w-12 h-12 rounded-full bg-surface-container-low flex items-center justify-center text-on-surface-variant">
                        <span class="material-symbols-outlined text-[24px]">group</span>
                    </div>
                    <div>
                        <div id="statTotal" class="text-headline-md font-headline-md text-on-surface">0</div>
                        <div class="text-label-sm font-label-sm text-on-surface-variant">总员工数</div>
                    </div>
                </div>
                <div class="bg-surface-container-lowest border border-outline-variant/20 rounded-xl p-4 shadow-[0_4px_12px_rgba(0,0,0,0.02)] flex items-center gap-4">
                    <div class="w-12 h-12 rounded-full bg-secondary-container/20 flex items-center justify-center text-secondary">
                        <span class="material-symbols-outlined text-[24px]">verified_user</span>
                    </div>
                    <div>
                        <div id="statDefault" class="text-headline-md font-headline-md text-on-surface">0</div>
                        <div class="text-label-sm font-label-sm text-on-surface-variant">主员工</div>
                    </div>
                </div>
                <div class="bg-surface-container-lowest border border-outline-variant/20 rounded-xl p-4 shadow-[0_4px_12px_rgba(0,0,0,0.02)] flex items-center gap-4">
                    <div class="w-12 h-12 rounded-full bg-surface-container-low flex items-center justify-center text-on-surface-variant">
                        <span class="material-symbols-outlined text-[24px]">work_outline</span>
                    </div>
                    <div>
                        <div id="statCustom" class="text-headline-md font-headline-md text-on-surface">0</div>
                        <div class="text-label-sm font-label-sm text-on-surface-variant">自定义员工</div>
                    </div>
                </div>
                <div class="bg-surface-container-lowest border border-outline-variant/20 rounded-xl p-4 shadow-[0_4px_12px_rgba(0,0,0,0.02)] flex items-center gap-4">
                    <div class="w-12 h-12 rounded-full bg-surface-container-low flex items-center justify-center text-on-surface-variant">
                        <span class="material-symbols-outlined text-[24px]">update</span>
                    </div>
                    <div>
                        <div id="statActive" class="text-headline-md font-headline-md text-on-surface">0</div>
                        <div class="text-label-sm font-label-sm text-on-surface-variant">工作中</div>
                    </div>
                </div>
            </div>

            <div class="bg-surface-container-lowest border border-outline-variant/30 rounded-xl overflow-hidden shadow-[0_4px_12px_rgba(0,0,0,0.02)]">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-surface-container-low border-b border-outline-variant/30">
                                <th class="px-6 py-4 text-label-sm font-label-sm text-on-surface-variant uppercase tracking-wider">员工名称</th>
                                <th class="px-6 py-4 text-label-sm font-label-sm text-on-surface-variant uppercase tracking-wider">核心能力</th>
                                <th class="px-6 py-4 text-label-sm font-label-sm text-on-surface-variant uppercase tracking-wider">可用工具</th>
                                <th class="px-6 py-4 text-label-sm font-label-sm text-on-surface-variant uppercase tracking-wider">模型</th>
                                <th class="px-6 py-4 text-label-sm font-label-sm text-on-surface-variant uppercase tracking-wider text-right">操作</th>
                            </tr>
                        </thead>
                        <tbody id="workersTable" class="divide-y divide-outline-variant/20">
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="mt-stack-lg flex justify-between items-center text-label-sm text-on-surface-variant/60">
                <p id="paginationInfo">显示 0-0 / 共 0 条员工数据</p>
                <div class="flex gap-2">
                    <button class="p-1.5 border border-outline-variant/30 rounded-lg hover:bg-surface-container-low disabled:opacity-30" disabled>
                        <span class="material-symbols-outlined">chevron_left</span>
                    </button>
                    <button class="p-1.5 border border-outline-variant/30 rounded-lg hover:bg-surface-container-low disabled:opacity-30" disabled>
                        <span class="material-symbols-outlined">chevron_right</span>
                    </button>
                </div>
            </div>
        </div>
    </main>
</div>

<div id="addWorkerModal" class="modal-overlay hidden">
    <div class="bg-surface-container-lowest rounded-2xl shadow-xl p-6 w-full max-w-md mx-4 border border-outline-variant/30">
        <div class="flex items-center justify-between mb-4">
            <h3 class="text-headline-md font-headline-md text-on-surface">添加员工</h3>
            <button onclick="closeAddWorkerModal()" class="p-2 text-on-surface-variant hover:text-on-surface hover:bg-surface-container-low rounded-full">
                <span class="material-symbols-outlined">close</span>
            </button>
        </div>
        <form id="addWorkerForm" class="space-y-4">
            <div>
                <label class="block text-label-md font-label-md text-on-surface-variant mb-1">员工名称</label>
                <input type="text" id="workerName" required class="w-full px-4 py-2 border border-outline-variant/30 rounded-lg bg-surface-container-lowest text-on-surface focus:ring-2 focus:ring-secondary focus:border-secondary" placeholder="例如：代码审查员">
            </div>
            <div>
                <label class="block text-label-md font-label-md text-on-surface-variant mb-1">系统提示词</label>
                <textarea id="workerPrompt" rows="4" required class="w-full px-4 py-2 border border-outline-variant/30 rounded-lg bg-surface-container-lowest text-on-surface focus:ring-2 focus:ring-secondary focus:border-secondary" placeholder="定义员工的角色和职责..."></textarea>
            </div>
            <div>
                <label class="block text-label-md font-label-md text-on-surface-variant mb-1">模型</label>
                <input type="text" id="workerModel" class="w-full px-4 py-2 border border-outline-variant/30 rounded-lg bg-surface-container-lowest text-on-surface focus:ring-2 focus:ring-secondary focus:border-secondary" placeholder="gpt-4" value="gpt-4">
            </div>
            <div>
                <label class="block text-label-md font-label-md text-on-surface-variant mb-1">提供商</label>
                <input type="text" id="workerProvider" class="w-full px-4 py-2 border border-outline-variant/30 rounded-lg bg-surface-container-lowest text-on-surface focus:ring-2 focus:ring-secondary focus:border-secondary" placeholder="openai" value="openai">
            </div>
            <div class="flex gap-3 pt-4">
                <button type="button" onclick="closeAddWorkerModal()" class="flex-1 px-4 py-2 border border-outline-variant/30 rounded-lg text-on-surface-variant hover:bg-surface-container-low">取消</button>
                <button type="submit" class="flex-1 px-4 py-2 bg-primary text-on-primary rounded-lg hover:bg-primary/90">创建</button>
            </div>
        </form>
    </div>
</div>

<script>
const API_BASE = '';
let allWorkers = [];

document.addEventListener('DOMContentLoaded', () => {
    loadWorkers();
});

async function loadWorkers() {
    try {
        const response = await fetch(`${API_BASE}/api/workers`);
        if (response.ok) {
            allWorkers = await response.json();
            renderWorkers();
            updateStats();
        }
    } catch (err) {
        console.error('加载员工失败:', err);
    }
}

function updateStats() {
    const total = allWorkers.length;
    const defaultCount = allWorkers.filter(w => w.is_default).length;
    const customCount = total - defaultCount;
    const activeCount = allWorkers.filter(w => w.status === 'active' || w.status === 'busy').length;
    
    document.getElementById('statTotal').textContent = total;
    document.getElementById('statDefault').textContent = defaultCount;
    document.getElementById('statCustom').textContent = customCount;
    document.getElementById('statActive').textContent = activeCount;
    
    document.getElementById('paginationInfo').textContent = `显示 1-${total} / 共 ${total} 条员工数据`;
}

function renderWorkers() {
    const tbody = document.getElementById('workersTable');
    tbody.innerHTML = '';
    
    if (allWorkers.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="px-6 py-8 text-center text-on-surface-variant">暂无员工数据</td></tr>';
        return;
    }
    
    allWorkers.forEach(worker => {
        const tr = document.createElement('tr');
        tr.className = 'hover:bg-surface-container-low/30 transition-colors group';
        
        const badgeClass = worker.is_default 
            ? 'bg-secondary-container/30 text-secondary border border-secondary/20' 
            : 'bg-surface-container-high text-on-surface-variant border border-outline-variant/30';
        const badgeText = worker.is_default ? '主员工' : '自定义';
        
        const toolsHtml = worker.cli_tools && worker.cli_tools.length > 0 
            ? worker.cli_tools.map(t => `<span class="px-3 py-1 bg-surface-container-low text-on-surface-variant text-[11px] font-medium rounded-md border border-outline-variant/20 w-fit">${escapeHtml(t)}</span>`).join('')
            : '<span class="text-on-surface-variant/70 text-label-sm">无</span>';
        
        const promptPreview = worker.prompt ? worker.prompt.substring(0, 100) + (worker.prompt.length > 100 ? '...' : '') : '无描述';
        
        tr.innerHTML = `
            <td class="px-6 py-5">
                <div class="flex flex-col gap-1.5">
                    <div class="flex items-center gap-2">
                        <span class="text-body-md font-semibold text-on-surface">${escapeHtml(worker.name)}</span>
                        <span class="inline-flex items-center px-2 py-0.5 rounded text-[10px] font-bold ${badgeClass} uppercase tracking-tighter">${badgeText}</span>
                    </div>
                    <div class="flex items-center gap-1.5 text-label-sm text-on-surface-variant/70">
                        <span class="material-symbols-outlined text-[14px]">grid_view</span>
                        <span>ID: ${escapeHtml(worker.id)}</span>
                    </div>
                </div>
            </td>
            <td class="px-6 py-5">
                <p class="text-body-md text-on-surface-variant line-clamp-2 max-w-md">${escapeHtml(promptPreview)}</p>
            </td>
            <td class="px-6 py-5">
                <div class="flex flex-wrap gap-1.5 max-w-[200px]">${toolsHtml}</div>
            </td>
            <td class="px-6 py-5">
                <div class="inline-flex items-center gap-1.5 px-3 py-1 bg-surface-container-low rounded-full text-label-sm text-on-surface-variant border border-outline-variant/20">
                    <span class="material-symbols-outlined text-[16px]">psychology</span>
                    ${escapeHtml(worker.model || 'gpt-4')} @ ${escapeHtml(worker.provider || 'openai')}
                </div>
            </td>
            <td class="px-6 py-5 text-right">
                <div class="flex items-center justify-end gap-2">
                    <button onclick="editWorker('${worker.id}')" class="p-2 text-on-surface-variant hover:text-secondary hover:bg-secondary-container/20 rounded-lg transition-colors">
                        <span class="material-symbols-outlined text-[20px]">edit</span>
                    </button>
                    ${!worker.is_default ? `<button onclick="deleteWorker('${worker.id}')" class="p-2 text-on-surface-variant hover:text-error hover:bg-error-container/20 rounded-lg transition-colors">
                        <span class="material-symbols-outlined text-[20px]">delete</span>
                    </button>` : ''}
                    <button onclick="setCurrentWorker('${worker.id}')" class="p-2 text-on-surface-variant hover:bg-surface-container-low rounded-lg transition-colors">
                        <span class="material-symbols-outlined text-[20px]">settings</span>
                    </button>
                </div>
            </td>
        `;
        
        tbody.appendChild(tr);
    });
}

function openAddWorkerModal() {
    document.getElementById('addWorkerModal').classList.remove('hidden');
    document.getElementById('addWorkerForm').reset();
}

function closeAddWorkerModal() {
    document.getElementById('addWorkerModal').classList.add('hidden');
}

document.getElementById('addWorkerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const name = document.getElementById('workerName').value.trim();
    const prompt = document.getElementById('workerPrompt').value.trim();
    const model = document.getElementById('workerModel').value.trim() || 'gpt-4';
    const provider = document.getElementById('workerProvider').value.trim() || 'openai';
    
    if (!name || !prompt) {
        alert('请填写必填字段');
        return;
    }
    
    try {
        const response = await fetch(`${API_BASE}/api/workers`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, prompt, model, provider })
        });
        
        if (response.ok) {
            closeAddWorkerModal();
            loadWorkers();
            alert('员工创建成功');
        } else {
            const error = await response.json();
            alert(error.detail || '创建失败');
        }
    } catch (err) {
        alert('创建失败: ' + err.message);
    }
});

async function deleteWorker(workerId) {
    if (!confirm('确定要删除这个员工吗？')) return;
    
    try {
        const response = await fetch(`${API_BASE}/api/workers/${workerId}`, { method: 'DELETE' });
        if (response.ok) {
            loadWorkers();
            alert('员工已删除');
        }
    } catch (err) {
        alert('删除失败: ' + err.message);
    }
}

async function setCurrentWorker(workerId) {
    try {
        const response = await fetch(`${API_BASE}/api/workers/${workerId}/set-current`, { method: 'POST' });
        if (response.ok) {
            loadWorkers();
            alert('已切换到该员工');
        }
    } catch (err) {
        alert('切换失败: ' + err.message);
    }
}

function editWorker(workerId) {
    alert('编辑功能开发中...');
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}
</script>
</body>
</html>
