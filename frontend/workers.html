<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>员工管理 - OmniAgent</title>
    <link href="./assets/output.css" rel="stylesheet"/>
    <link href="./assets/inter.css" rel="stylesheet"/>
    <link href="./assets/material-symbols.css" rel="stylesheet"/>
    <style>
        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 10px; }
        
        body { 
            background: #f7f9fb;
            min-height: 100vh;
        }
        
        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            display: flex; align-items: center; justify-content: center;
            z-index: 9999;
        }
        .modal-overlay.hidden { display: none; }
        .hidden { display: none !important; }
    </style>
</head>
<body class="font-sans text-gray-800 antialiased min-h-screen flex flex-col overflow-hidden">

<!-- TopAppBar -->
<header class="h-16 flex justify-between items-center px-8 w-full bg-white/80 backdrop-blur-md border-b border-gray-200 z-10 sticky top-0 shrink-0">
    <div class="flex items-center gap-4">
        <a href="./index.html" class="flex items-center text-gray-600 hover:text-gray-900 text-sm font-medium transition-colors gap-1.5">
            <span class="material-symbols-outlined text-[18px]">arrow_back</span>
            返回
        </a>
    </div>
    <div class="flex items-center gap-2">
        <button class="text-gray-600 hover:bg-gray-100 p-2 rounded-full transition-colors">
            <span class="material-symbols-outlined">notifications</span>
        </button>
        <button class="text-gray-600 hover:bg-gray-100 p-2 rounded-full transition-colors">
            <span class="material-symbols-outlined">help_outline</span>
        </button>
        <div class="h-8 w-8 rounded-full bg-gray-200 overflow-hidden border border-gray-300 flex items-center justify-center text-gray-600 font-medium text-sm">
            U
        </div>
    </div>
</header>

<!-- Page Content -->
<main class="flex-1 overflow-y-auto bg-white p-8">
    <div class="max-w-7xl mx-auto">
        <!-- Page Header -->
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
            <div class="flex items-center gap-3">
                <span class="material-symbols-outlined text-blue-600 text-[32px]">group</span>
                <h2 class="text-3xl font-semibold text-gray-900">员工管理</h2>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="refreshWorkers()" class="p-2 text-gray-600 hover:bg-gray-100 rounded-full transition-colors">
                    <span class="material-symbols-outlined">refresh</span>
                </button>
                <button onclick="openAddWorkerModal()" class="bg-gray-900 hover:bg-gray-800 text-white font-medium text-sm px-6 py-2.5 rounded-full shadow-sm transition-all flex items-center gap-2">
                    <span class="material-symbols-outlined text-[18px]">add</span>
                    添加员工
                </button>
            </div>
        </div>

        <!-- Stats Overview -->
        <div id="statsOverview" class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <div class="bg-white border border-gray-200 rounded-xl p-4 shadow-sm flex items-center gap-4">
                <div class="w-12 h-12 rounded-full bg-gray-100 flex items-center justify-center text-gray-600">
                    <span class="material-symbols-outlined text-[24px]">group</span>
                </div>
                <div>
                    <div class="text-2xl font-semibold text-gray-900" id="stat-total">0</div>
                    <div class="text-xs font-medium text-gray-500 uppercase tracking-wide">总员工数</div>
                </div>
            </div>
            <div class="bg-white border border-gray-200 rounded-xl p-4 shadow-sm flex items-center gap-4">
                <div class="w-12 h-12 rounded-full bg-blue-50 flex items-center justify-center text-blue-600">
                    <span class="material-symbols-outlined text-[24px]">verified_user</span>
                </div>
                <div>
                    <div class="text-2xl font-semibold text-gray-900" id="stat-default">0</div>
                    <div class="text-xs font-medium text-gray-500 uppercase tracking-wide">主员工</div>
                </div>
            </div>
            <div class="bg-white border border-gray-200 rounded-xl p-4 shadow-sm flex items-center gap-4">
                <div class="w-12 h-12 rounded-full bg-gray-100 flex items-center justify-center text-gray-600">
                    <span class="material-symbols-outlined text-[24px]">work_outline</span>
                </div>
                <div>
                    <div class="text-2xl font-semibold text-gray-900" id="stat-custom">0</div>
                    <div class="text-xs font-medium text-gray-500 uppercase tracking-wide">自定义员工</div>
                </div>
            </div>
            <div class="bg-white border border-gray-200 rounded-xl p-4 shadow-sm flex items-center gap-4">
                <div class="w-12 h-12 rounded-full bg-green-50 flex items-center justify-center text-green-600">
                    <span class="material-symbols-outlined text-[24px]">update</span>
                </div>
                <div>
                    <div class="text-2xl font-semibold text-gray-900" id="stat-active">0</div>
                    <div class="text-xs font-medium text-gray-500 uppercase tracking-wide">工作中</div>
                </div>
            </div>
        </div>

        <!-- Workers List -->
        <div id="workersList" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden text-center py-20">
            <span class="material-symbols-outlined text-7xl text-gray-300 mb-4">group_off</span>
            <p class="text-gray-500 text-lg mb-4">暂无员工</p>
            <button onclick="openAddWorkerModal()" class="text-sm text-blue-600 hover:text-blue-700 font-medium">
                + 添加第一个员工
            </button>
        </div>
    </div>
</main>

<!-- Add/Edit Worker Modal -->
<div id="workerModal" class="modal-overlay hidden">
    <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-2xl mx-4 max-h-[90vh] overflow-y-auto">
        <div class="flex items-center justify-between mb-6">
            <h2 id="modalTitle" class="text-2xl font-bold text-gray-800">添加员工</h2>
            <button onclick="closeWorkerModal()" class="text-gray-400 hover:text-gray-600 transition-colors">
                <span class="material-symbols-outlined text-2xl">close</span>
            </button>
        </div>
        <form id="workerForm" onsubmit="saveWorker(event)">
            <input type="hidden" id="workerId"/>
            <div class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        员工名称 <span class="text-red-500">*</span>
                    </label>
                    <input id="workerName" type="text" required
                        class="w-full px-4 py-3 bg-white border-2 border-gray-200 rounded-xl focus:outline-none focus:border-blue-400 text-sm"
                        placeholder="例如: 代码专家"/>
                </div>
                
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        系统提示词 <span class="text-red-500">*</span>
                    </label>
                    <textarea id="workerPrompt" rows="6" required
                        class="w-full px-4 py-3 bg-white border-2 border-gray-200 rounded-xl focus:outline-none focus:border-blue-400 text-sm resize-none"
                        placeholder="描述这个员工的角色和能力..."></textarea>
                </div>
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">模型</label>
                        <select id="workerModel"
                            class="w-full px-4 py-3 bg-white border-2 border-gray-200 rounded-xl focus:outline-none focus:border-blue-400 text-sm">
                            <option value="gpt-4">GPT-4</option>
                            <option value="gpt-3.5-turbo">GPT-3.5 Turbo</option>
                            <option value="claude-3">Claude 3</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">提供商</label>
                        <select id="workerProvider"
                            class="w-full px-4 py-3 bg-white border-2 border-gray-200 rounded-xl focus:outline-none focus:border-blue-400 text-sm">
                            <option value="openai">OpenAI</option>
                            <option value="anthropic">Anthropic</option>
                            <option value="azure">Azure</option>
                        </select>
                    </div>
                </div>
                
                <div class="flex gap-4 pt-6 border-t border-gray-200 mt-6">
                    <button type="button" onclick="closeWorkerModal()"
                        class="flex-1 px-6 py-3 bg-white border-2 border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 transition-colors font-medium text-sm">
                        取消
                    </button>
                    <button type="submit"
                        class="flex-1 px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-all font-medium text-sm shadow-sm">
                        确定添加
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>

<script>
const API_BASE = '';
let workers = [];

document.addEventListener('DOMContentLoaded', () => {
    loadWorkers();
});

async function loadWorkers() {
    try {
        const response = await fetch(`${API_BASE}/api/workers`);
        const data = await response.json();
        workers = data.workers || [];
        updateStats(data.statistics || {});
        renderWorkers();
    } catch (error) {
        console.error('加载员工失败:', error);
    }
}

function updateStats(stats) {
    document.getElementById('stat-total').textContent = stats.total_workers || 0;
    document.getElementById('stat-default').textContent = stats.default_workers || 0;
    document.getElementById('stat-custom').textContent = stats.custom_workers || 0;
    document.getElementById('stat-active').textContent = stats.active_workers || 0;
}

function renderWorkers() {
    const container = document.getElementById('workersList');
    const emptyState = document.getElementById('emptyState');
    
    if (workers.length === 0) {
        container.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
    }
    
    emptyState.classList.add('hidden');
    container.innerHTML = workers.map(worker => `
        <div class="bg-white border border-gray-200 rounded-xl p-6 shadow-sm hover:shadow-md transition-shadow">
            <div class="flex items-start justify-between mb-4">
                <div class="flex-1">
                    <h3 class="font-bold text-gray-900 text-lg mb-2">${escapeHtml(worker.name)}</h3>
                    ${worker.is_default ? '<span class="inline-block px-2 py-1 bg-blue-100 text-blue-700 text-xs font-medium rounded">主员工</span>' : ''}
                </div>
                <button onclick="deleteWorker('${worker.id}')" class="text-gray-400 hover:text-red-600 transition-colors">
                    <span class="material-symbols-outlined">delete</span>
                </button>
            </div>
            <p class="text-sm text-gray-600 mb-4 line-clamp-3">${escapeHtml(worker.prompt)}</p>
            <div class="flex items-center justify-between text-xs text-gray-500">
                <span>${worker.model}</span>
                <button onclick="setCurrentWorker('${worker.id}')" class="text-blue-600 hover:text-blue-700 font-medium">
                    设为当前
                </button>
            </div>
        </div>
    `).join('');
}

function openAddWorkerModal() {
    document.getElementById('modalTitle').textContent = '添加员工';
    document.getElementById('workerForm').reset();
    document.getElementById('workerId').value = '';
    document.getElementById('workerModal').classList.remove('hidden');
}

function closeWorkerModal() {
    document.getElementById('workerModal').classList.add('hidden');
}

async function saveWorker(event) {
    event.preventDefault();
    
    const data = {
        name: document.getElementById('workerName').value,
        prompt: document.getElementById('workerPrompt').value,
        model: document.getElementById('workerModel').value,
        provider: document.getElementById('workerProvider').value
    };
    
    try {
        const response = await fetch(`${API_BASE}/api/workers`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        
        if (response.ok) {
            closeWorkerModal();
            loadWorkers();
        }
    } catch (error) {
        console.error('保存失败:', error);
        alert('保存失败');
    }
}

async function deleteWorker(workerId) {
    if (!confirm('确定要删除这个员工吗？')) return;
    
    try {
        const response = await fetch(`${API_BASE}/api/workers/${workerId}`, {
            method: 'DELETE'
        });
        
        if (response.ok) {
            loadWorkers();
        }
    } catch (error) {
        console.error('删除失败:', error);
    }
}

async function setCurrentWorker(workerId) {
    try {
        const response = await fetch(`${API_BASE}/api/workers/${workerId}/set-current`, {
            method: 'POST'
        });
        
        if (response.ok) {
            loadWorkers();
        }
    } catch (error) {
        console.error('设置失败:', error);
    }
}

function refreshWorkers() {
    loadWorkers();
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}
</script>

</body>
</html>
